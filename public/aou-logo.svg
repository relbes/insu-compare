<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Arab Open University - Jordan (AOU) Official Styled Vector Emblem & Typography -->
  <defs>
    <linearGradient id="aouBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3876" />
      <stop offset="100%" stop-color="#08214D" />
    </linearGradient>
    <linearGradient id="aouGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A859" />
      <stop offset="100%" stop-color="#007A3D" />
    </linearGradient>
    <linearGradient id="aouGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B324" />
      <stop offset="100%" stop-color="#D98207" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Emblem Icon Container -->
  <g transform="translate(10, 8)" filter="url(#softGlow)">
    <!-- Outer Shield / Circular Seal Background -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#aouBlueGrad)" />
    <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#aouGoldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Open Book Pages (Wisdom & Education) -->
    <!-- Left Page -->
    <path d="M16 45 C22 41 28 42 32 46 C32 28 32 26 32 26 C28 22 22 21 16 25 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Right Page -->
    <path d="M48 45 C42 41 36 42 32 46 C32 28 32 26 32 26 C36 22 42 21 48 25 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Spine / Center Pillar -->
    <path d="M31 25.5 L33 25.5 L33 46.5 L31 46.5 Z" fill="url(#aouGoldGrad)" />

    <!-- Dynamic Arch of Knowledge / Global Orbit -->
    <path d="M19 22 C23 15 41 15 45 22" stroke="url(#aouGreenGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M22 17 C26 12 38 12 42 17" stroke="url(#aouGoldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Center Torch / Sun Star of Excellence -->
    <circle cx="32" cy="18" r="3" fill="url(#aouGoldGrad)" />
    <circle cx="32" cy="18" r="1.5" fill="#FFFFFF" />

    <!-- University Laurel / Accent Base Leaves -->
    <path d="M18 48 C24 51 28 50 32 48 C36 50 40 51 46 48" stroke="url(#aouGreenGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography: Bilingual Arabic & English -->
  <g transform="translate(85, 25)">
    <!-- Arabic Main Title -->
    <text x="0" y="0" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="currentColor" class="text-slate-900 dark:text-white" letter-spacing="-0.2">
      الجامعة العربية المفتوحة
    </text>
    <!-- Branch: Jordan -->
    <text x="148" y="-1" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#00A859">
      - الأردن
    </text>

    <!-- English Subtitle -->
    <text x="0" y="19" font-family="'Inter', 'Roboto', 'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="currentColor" class="text-slate-600 dark:text-slate-300" letter-spacing="0.4">
      ARAB OPEN UNIVERSITY
    </text>
    <text x="135" y="19" font-family="'Inter', 'Roboto', 'Segoe UI', sans-serif" font-weight="800" font-size="9.5" fill="#F5B324" letter-spacing="0.5">
      JORDAN
    </text>

    <!-- Academic Mission Badge -->
    <text x="0" y="34" font-family="'Cairo', 'Tajawal', 'Inter', sans-serif" font-weight="600" font-size="9" fill="currentColor" class="text-slate-400 dark:text-slate-400">
      نظام مقارنة التأمين الطبي للعاملين • Medical Insurance System
    </text>
  </g>
</svg>
